<nav class="sn-nav">
  <a class="sn-logo" routerLink="/">
    <span class="name">Dyarna</span>
    <span dir="rtl" lang="ar" class="sn-logo-ar">ديارنا</span>
  </a>
  <div class="sn-nav__links">
    <a routerLink="/decouvertes" routerLinkActive="active">Découvertes</a>
    <a routerLink="/carte" routerLinkActive="active">Carte</a>
    @if (auth.isLoggedIn()) {
      <a routerLink="/favoris" routerLinkActive="active">Favoris</a>
      <a routerLink="/profil" routerLinkActive="active">{{ auth.currentPseudo() }}</a>
      <a href="#" (click)="logout($event)">Déconnexion</a>
    } @else {
      <a routerLink="/connexion" routerLinkActive="active">Connexion</a>
    }
  </div>
</nav>
<router-outlet></router-outlet>
<footer class="sn-footer">
  <span>© 2026 Dyarna</span>
  <div>
    <a href="#">À propos</a>
    <a href="#">Contact</a>
  </div>
</footer>

<!-- Toasts globaux -->
<div class="toast-container">
  @for (t of toast.toasts(); track trackToast($index, t)) {
    <div class="toast toast--{{ t.type }}" (click)="toast.dismiss(t.id)">
      {{ t.message }}
    </div>
  }
</div>
